[languages.en.params.themes.event]
slogan = "Bringing the BSides community back to Amsterdam!"
description = """
Security BSides is a community-driven framework for building events, by and for, information security community members. These events are already happening in major cities all over the world! We are responsible for organizing an independent BSides-Approved event in Amsterdam.
Our goal is to bring together at least 400 people from the InfoSec community this year. Back, and planning to be bigger than ever!"""

directions = """
#### Public transport
The Tram stops Alexanderplein and Linnaeusstraat are both right in front of our building and are easy and quickly available:
* From Amsterdam Central Station: tram 14 – tram stop Alexanderplein
* From Amsterdam Sloterdijk: tram 19 – tram stop Alexanderplein
* From Diemen: tram 19 – tram stop Linnaeusstraat 1e van Swindenstraat

**NOTE:** There is a lot of construction happening around KIT.
For the latest information on tram route changes, always check a route-planner such as the [Reisplanner GVB](https://gvb.nl/reisinformatie/reisplanner).

#### By car
Take the Watergraafsmeer/Diemen (s113) exit from the A10 ring road. At the end of the road choose the exit heading to Centrum/Watergraafsmeer. Continue through via the Middenweg that turns into the Linnaeusstraat. Koninklijk Instituut voor de Tropen is located at the end of this street on the corner of Mauritskade.

#### Parking garage
The nearest parking garage is:
  * Q-Park Oostpoort
  * Polderweg 92
  * 1093 KP Amsterdam

From this parking garage you can take tram 19 and you will arrive to our building in two stops.

#### Public parking
There are several public parking spot closeby:
* Parking on the public road in the Dapperbuurt/Oosterparkbuurt, the rate in this zone is €6.00 per hour.
* The parking garage at the OLVG, ‘s Gravesandeplein 120, rate is €6.00 per hour.
* Q-Park Oostpoort parking garage, Polderweg 92, rate €3.33 per hour.
* Parking garage Park Bee Ingenieur Jakoba Mulderplein, rate €3.50 per hour.
* Mobihub P+R Oostpoort, Polderweg 92, free parking spaces in combination with a rental bicycle.
* There are various P+R locations around the city, which can be combined with public transport (under certain conditions) at a discount. KIT can be reached by tram 7, 14 and 19.

"""
aboutUs = """
![BAms logo](images/bams_logo.png)

### BSides history
BSides is a community-driven framework for building events for and by information security community members. The goal is to expand the spectrum of conversation beyond the traditional confines of space and time. It creates opportunities for individuals to both present and participate in an intimate atmosphere that encourages collaboration. It is an intense event with discussions, demos, and interaction from participants. It is where conversations for the next-big-thing are happening.

After the great revivial of BSides Amsterdam in 2025, we are back for more in 2026!

### Our not-for-profit mission
The organization of BSides Amsterdam is a non-profit foundation (Stichting in Dutch), with goal to host events for the InfoSec community to allow knowledge sharing and eduction within the industry.
BSides Amsterdam is organized by [Stichting Polder Security](https://poldersecurity.nl).

The foundation aims to:
* Promote the interests of Information Security and Information Technology industry members.
* Disseminate knowledge about cloud and cybersecurity.
* Stimulate the application of Information Security in the broaderst sense in the professional environment of, among others, companies, organizations, government and education.
* Improve contacts between students, professionals and organizations that deal with Information Security and Information Technology, both nationally and internationally.
* And furthermore everything that is related to this in the broadest sense, belongs to it and/or can be conducive to it.

The foundation tries to achieve its goal by, among others:
* Regularly organizing independent conferences for interested parties as well as organizations that deal with and/or use Information Security or Information Technology, where suppliers and affiliated groups can also present themselves;
* Stimulate, initiate and organize community meetings;
* Maintain contacts with other national and international organizations with similar objectives; and
* Building and maintaining contacts with users and suppliers with knowledge and/or expertise that are deemed to be of importance to the Foundation and the goals it pursues and aims to achieve.

### About the company behind BSides AMS
#### Stichting Polder Security
Stichting Polder Security is a registered Dutch non-profit foundation (*stichting*). Below you'll find our official details.

#### Foundation Details
- **Legal name:** Stichting Polder Security
- **KVK (Chamber of Commerce):** 42056206
- **RSIN / Fiscal number:** 869507096
- **Date of establishment:** 8 May 2026

#### Address
- **Street:** Van Linschotenlaan 423
- **Postal code & city:** 1212 DW Hilversum
- **Country:** The Netherlands

#### Bank Details
- **Account holder:** Stichting Polder Security
- **IBAN:** NL59 INGB 0119 3314 62
- **BIC:** INGBNL2A
- **Bank:** ING Bank N.V.

#### Contact
- **Email:** info@poldersecurity.nl
- **Website:** poldersecurity.nl

#### ANBI

**Non-profit status:** Stichting Polder Security does not aim to make a profit. Any surplus shall be used exclusively to further the foundation's statutory objectives.

**Remuneration policy:** Board members receive no remuneration for their work, only reimbursement of actual expenses incurred.

For more information, see the [Stichting Polder Security website](https://www.poldersecurity.nl/about/).
"""

